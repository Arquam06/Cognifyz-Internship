<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation - Cognifyz Task 6</title>
    <meta name="description" content="A form with robust client-side validation logic.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <h2>Create an Account</h2>
                <p>Sign up to get started today.</p>
            </div>
            
            <form id="signup-form" novalidate>
                <div class="input-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" placeholder="John Doe" autocomplete="off">
                    <span class="error-msg" id="username-error"></span>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" autocomplete="off">
                    <span class="error-msg" id="email-error"></span>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters">
                    <span class="error-msg" id="password-error"></span>
                </div>
                
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
            
            <div id="success-msg" class="success-msg hidden">
                Account created successfully! Welcome aboard.
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
