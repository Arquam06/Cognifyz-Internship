<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button - Cognifyz Task 4</title>
    <meta name="description" content="An interactive button that toggles the page background color.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrap">
                <span id="theme-icon">☀️</span>
            </div>
            <h1>Interactive Theme Toggle</h1>
            <p>Click the button below to toggle between Light and Dark mode using JavaScript event listeners.</p>
            <button id="theme-toggle" class="toggle-btn">
                Switch to Dark Mode
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
